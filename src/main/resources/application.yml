server:
  # 本机开发默认 8084（与容器一致，避免两套端口心智负担）；
  # ⚠️ 前端 hnd_factory_UI/vite.config.js 的 proxy target 需同步指向 8084
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: hnd_factory # 服务名称，Nacos注册用，Feign里@FeignClient name对应这个
  # mysql配置
  # 本机开发默认连本机 MySQL；容器部署由 application-prod.yml 覆盖为 1Panel 的容器名
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:factory_db}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # 不设默认值：口令绝不能写进仓库（本文件在公开仓库中，且历史提交无法撤销）。
    # 本地开发请在工作目录建 config/application.yml（已 gitignore，见 config/application.yml.example）；
    # 容器部署由 1Panel 的 MYSQL_PASSWORD 环境变量注入。
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: ${MYSQL_POOL_MAX:10}
      minimum-idle: ${MYSQL_POOL_MIN:2}
      connection-timeout: 30000
  # Nacos注册中心
  cloud:
    nacos:
      discovery:
        # 本机开发默认连本机 Nacos；容器部署由 application-prod.yml 覆盖为容器名
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
  # 文件上传限制：生产入库单含内嵌图片，文件可达数 MB（默认 1MB 会 413）
  # ⚠️ 改这里的同时，Nginx 的 client_max_body_size 必须同步调大，否则请求到不了应用
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:50MB}

# MyBatis-plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: org.example.entity
  configuration:
    map-underscore-to-camel-case: true # 下划线自动转驼峰，数据库pick_no映射pickNo

# 图片对外基础路径（见《前后端改动统筹》变更-001）
# 同源部署留空 → 前端拿到 /files/xxx、/thumbs/xxx 相对路径；
# 非同源部署时填域名（如 https://img.example.com），由 Nginx 路由到 img-service。
image:
  base-url: ${IMAGE_BASE_URL:}

# Sa-Token 基础配置
sa-token:
  token-name: satoken      # token 名称，前端请求头携带 satoken: <token>
  timeout: ${SA_TOKEN_TIMEOUT:86400} # token 有效期（秒），86400 = 24 小时，-1 为永不过期
  active-timeout: -1       # 活跃超时（秒），-1 表示不开启
  is-concurrent: true      # 允许同一账号并发登录
  is-share: true           # 并发登录时共用一个 token
  token-style: uuid        # token 风格
  is-log: false            # 是否打印操作日志
  is-read-cookie: true     # 是否从 Cookie 读取 token
  is-read-header: true     # 是否从 Header 读取 token
