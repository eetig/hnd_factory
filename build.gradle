plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

java {
    // 明确按 Java 21 编译，避免 IDEA / 服务器 JDK 版本不一致导致 UnsupportedClassVersionError
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    maven { url 'https://maven.aliyun.com/repository/central' }
    maven { url 'https://maven.aliyun.com/repository/spring' }
    mavenCentral()
}

dependencyManagement {
    imports {
        // Spring Cloud BOM，与 Spring Boot 3.5.x 官方配对
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.0.3"
        // Spring Cloud Alibaba BOM
        mavenBom "com.alibaba.cloud:spring-cloud-alibaba-dependencies:2025.0.0.0"
    }
}

dependencies {
    // SpringBoot Web
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // 参数校验
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // OpenFeign 微服务调用：版本一律交给上面的 BOM 管理。
    // 此前这里还写死过 :4.1.0，会覆盖 BOM 并在 BOM 升级时把版本拽回旧版，已移除。
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    // SpringCloud LoadBalancer 负载均衡（Feign+nacos服务发现必须）
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    // MyBatis Plus SpringBoot3专用
    implementation 'com.baomidou:mybatis-plus-spring-boot3-starter:3.5.17'
    // MySQL驱动
    implementation 'com.mysql:mysql-connector-j'
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // nacos 服务注册发现（版本由 BOM 管理）
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery'

    // 单元测试
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // 权限框架
    implementation 'cn.dev33:sa-token-spring-boot3-starter:1.46.0'

    // EasyExcel：本地解析工单导入文件
    implementation 'com.alibaba:easyexcel:3.3.3'

    // 服务间共享契约（ExcelResult / GoodsMoveExcelDTO / WorkOrderExcelDTO），
    // 由 shared-contract 定义唯一一份，勿在此另行复制
    implementation 'org.example:shared-contract:1.0-SNAPSHOT'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    // 源码含中文（日志/异常文案），必须 UTF-8，否则服务器/CI 编译出现乱码
    options.encoding = 'UTF-8'
}

// 禁用普通 jar：build/libs 下只保留一个可执行 jar，Dockerfile 的 COPY 才不会歧义
tasks.named('jar') {
    enabled = false
}

// 固定产物文件名，让 Dockerfile 里 COPY 的路径稳定、不随版本号变化
bootJar {
    archiveFileName = 'hnd_factory.jar'
    // 便于在服务器上确认镜像内跑的到底是哪次构建
    manifest {
        attributes(
                'Implementation-Title': 'hnd_factory',
                'Implementation-Version': project.version,
                'Build-Time': new Date().format("yyyy-MM-dd HH:mm:ss")
        )
    }
}
