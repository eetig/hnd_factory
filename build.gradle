plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

java {
    // 明确按 Java 21 编译，避免 IDEA / 服务器 JDK 版本不一致导致 UnsupportedClassVersionError
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    maven { url 'https://maven.aliyun.com/repository/central' }
    maven { url 'https://maven.aliyun.com/repository/spring' }
    mavenCentral()
}

dependencyManagement {
    imports {
        // Spring Cloud 版本
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.0"
        // Spring Cloud Alibaba 版本管理
        mavenBom "com.alibaba.cloud:spring-cloud-alibaba-dependencies:2023.0.1.0"
    }
}

dependencies {
    // SpringBoot Web
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // 参数校验
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // OpenFeign 微服务调用
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    // ✅ 新增：SpringCloud LoadBalancer 负载均衡（Feign+nacos服务发现必须）
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    // MyBatis Plus SpringBoot3专用
    implementation 'com.baomidou:mybatis-plus-spring-boot3-starter:3.5.5'
    // MySQL驱动
    implementation 'com.mysql:mysql-connector-j'
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // nacos 服务注册发现
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery'

    // 单元测试
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    //feign
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign:4.1.0'

    implementation 'cn.dev33:sa-token-spring-boot3-starter:1.39.0'

    // EasyExcel：本地解析工单导入文件
    implementation 'com.alibaba:easyexcel:3.3.3'


}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    // 源码含中文（日志/异常文案），必须 UTF-8，否则服务器/CI 编译出现乱码
    options.encoding = 'UTF-8'
}

// 禁用普通 jar：build/libs 下只保留一个可执行 jar，Dockerfile 的 COPY 才不会歧义
tasks.named('jar') {
    enabled = false
}

// 固定产物文件名，让 Dockerfile 里 COPY 的路径稳定、不随版本号变化
bootJar {
    archiveFileName = 'hnd_factory.jar'
    // 便于在服务器上确认镜像内跑的到底是哪次构建
    manifest {
        attributes(
                'Implementation-Title': 'hnd_factory',
                'Implementation-Version': project.version,
                'Build-Time': new Date().format("yyyy-MM-dd HH:mm:ss")
        )
    }
}
